name: Bug
description: Something does not work as it should
title: "[scope] "
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. kg init
        2. kg extract .
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the output or the traceback
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: kg 0.1.0 · Python 3.12 · Ubuntu 24.04
