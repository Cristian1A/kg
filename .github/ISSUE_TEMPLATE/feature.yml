name: Feature
description: Implement a requirement from the functional requirements document
title: "[scope] "
labels: ["type:feature"]
body:
  - type: input
    id: requirements
    attributes:
      label: Related requirements
      description: IDs from docs/requirements.md
      placeholder: RF-01, RF-02
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: ["MVP (v0.1)", "v0.2", "Future"]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be built and why
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] 
        - [ ] Tests in tests/ covering the normal case, the edge case and the error case
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Affected modules, dependencies, open questions
