[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kg"
dynamic = ["version"]
description = "Convierte el conocimiento de un proyecto en un grafo consultable"
readme = "AGENTS.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.7",
    "matplotlib>=3.11",
    # Validación con JSON Schema draft 2020-12 y rutas de error (RF-01, RF-04)
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[project.scripts]
kg = "kg.cli:main"

[tool.setuptools.dynamic]
version = { attr = "kg.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kg = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Los scripts de la raíz son prototipos de exploración
extend-exclude = ["env", "lib", "graph.py", "di_graph.py", "tuto.py", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
