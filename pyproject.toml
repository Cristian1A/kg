[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kg"
dynamic = ["version"]
description = "Turn a codebase's knowledge into a queryable knowledge graph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.7",
    "matplotlib>=3.11",
    # JSON Schema draft 2020-12 validation with error paths (RF-01, RF-04)
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]
# Only for the benchmark in bench/ (#39), which calls a model; kg itself does
# not (RF-24)
bench = [
    "anthropic>=1.13",
]

[project.scripts]
kg = "kg.cli:main"

[tool.setuptools.dynamic]
version = { attr = "kg.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kg = ["schema/*.json", "render/assets/*", "agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["env"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
